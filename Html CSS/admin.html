        .product {

            align-items: center;
        }

        img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
        }

        .left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .delete-btn {
            background: crimson;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Z&S Fashion Admin Panel</h1>

        <input type="text" id="name" placeholder="Ürün Adı">

        <input type="number" id="price" placeholder="Fiyat">

        <select id="category">
            <option value="კაბა">Kıyafet</option>
            <option value="ბლუზკა">Bluz</option>
            <option value="ჟაკეტი">Ceket</option>
        </select>

        <input type="file" id="imageFile" accept="image/*">

        <button onclick="addProduct()">Ürün Ekle</button>

        <div class="products" id="products"></div>
    </div>

    <script type="module">
        import {
            db,
            collection,
            addDoc,
            getDocs,
            deleteDoc,
            doc
        } from './firebase.js';

        const productsDiv = document.getElementById('products');

        async function loadProducts() {
            productsDiv.innerHTML = "";

            const querySnapshot = await getDocs(collection(db, "products"));

            querySnapshot.forEach((docItem) => {
                const data = docItem.data();

                productsDiv.innerHTML += `
      <div class="product">
        <div class="left">
          <img src="${data.image}">
          <div>
            <h3>${data.name}</h3>
            <p>₾${data.price}</p>
          </div>
        </div>

        <button class="delete-btn" onclick="removeProduct('${docItem.id}')">
          Sil
        </button>
      </div>
    `;
            });
        }

        window.removeProduct = async (id) => {
            await deleteDoc(doc(db, "products", id));
            loadProducts();
        }

        window.addProduct = async () => {

            const name = document.getElementById('name').value;
            const price = document.getElementById('price').value;
            const category = document.getElementById('category').value;

            const file = document.getElementById('imageFile').files[0];

            if (!name || !price || !file) {
                alert("Tüm alanları doldur!");
                return;
            }

            const storageRef = ref(storage, 'products/' + file.name);
            await uploadBytes(storageRef, file);

            const imageUrl = await getDownloadURL(storageRef);

            await addDoc(collection(db, "products"), {
                name,
                price,
                category,
                image: imageUrl
            });

            document.getElementById('name').value = '';
            document.getElementById('price').value = '';

            loadProducts();
        }

        });

        document.getElementById('price').value = '';
        document.getElementById('image').value = '';

        loadProducts();


        loadProducts();
    </script>

</body>

</html>
